name: Publish

# Trusted publishing (OIDC). No npm token exists anywhere — not in the repo,
# not in Actions secrets, not on a laptop. npm verifies the identity of this
# workflow directly against the package's configured trusted publisher, and
# mints a short-lived credential for the publish only.
#
# This is also the only route that survives npm's deprecation of
# bypass-2FA tokens for direct publishing.
#
# Setup on npmjs.com (once, per package):
#   Package → Settings → Trusted Publisher → GitHub Actions
#     Organization or user : attestwire
#     Repository           : en16931
#     Workflow filename    : publish.yml
#     Environment          : (leave blank)
#
# To release: bump the version in package.json, update CHANGELOG.md, push,
# then run this workflow from the Actions tab (or push a v* tag).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      # Required for OIDC. Without this the publish falls back to looking for
      # a token and fails.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      # Trusted publishing requires npm >= 11.5.1, which is newer than the npm
      # bundled with Node 22. Upgrade explicitly rather than relying on the
      # runner image.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      # prepublishOnly runs build + test again during `npm publish`; running
      # them here first means a failure surfaces before we touch the registry.
      - run: npm run build
      - run: npm test

      # Refuse to publish a version that is already on the registry. Without
      # this the job fails late, inside npm publish, with a noisier error.
      - name: Check version is unpublished
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "Publishing $NAME@$VERSION"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is already published. Bump the version first."
            exit 1
          fi

      # --provenance attaches a signed attestation linking the tarball to this
      # workflow run and this commit. Free, and it is the thing that makes the
      # supply chain checkable by someone who does not trust us.
      - name: Publish
        run: npm publish --provenance --access public
