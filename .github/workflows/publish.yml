# Publish to npm on a published GitHub release, with no token anywhere.
#
# This uses npm trusted publishing (OIDC): npm is configured to trust
# attestwire/en16931's `publish.yml`, and the short-lived id-token minted below
# is what authenticates the publish. There is deliberately no NODE_AUTH_TOKEN,
# no NPM_TOKEN and no secrets context in this file — a long-lived token is the
# thing this workflow exists to make unnecessary.
#
# Provenance is attached automatically by trusted publishing; do not add
# --provenance, which conflicts with it.
name: Publish

on:
  release:
    types: [published]

permissions:
  id-token: write # OIDC token for npm trusted publishing
  contents: read

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    # Releases are cut from v* tags; anything else is not a release of this package.
    if: startsWith(github.event.release.tag_name, 'v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 still ships npm 10.
      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      - run: npm run build

      - run: npm test

      # A tag that disagrees with package.json publishes the wrong thing under
      # the right name, so fail before the registry sees it.
      - name: Check tag matches package version
        run: |
          tag="${{ github.event.release.tag_name }}"
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "release tag $tag does not match package.json $pkg" >&2
            exit 1
          fi

      - name: Publish
        run: npm publish
