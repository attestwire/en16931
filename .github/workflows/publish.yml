# Publish @attestwire/en16931 to npm when a v* tag lands on this repository,
# with no token anywhere.
#
# This file lives in the development monorepo at
# packages/en16931/.github/workflows/publish.yml, where it never runs (GitHub
# only loads workflows from a repository's root). It runs HERE, in the public
# repository, which the monorepo's release workflow updates on every release:
# it mirrors the tagged package, then pushes the commit and the tag, and that
# tag push starts this workflow.
#
# Publishing from here, not from the monorepo, is deliberate. npm generates a
# provenance attestation only for a package published from a PUBLIC
# repository, so 0.4.0 to 0.9.0, published from the private monorepo, carry
# none. 0.2.0 to 0.3.0 were published by this workflow and do. The
# attestation is what lets anyone check that the package on npm was built from
# a commit they can read here.
#
# npm trusted publishing (OIDC) must be configured on npmjs.com to trust
# attestwire/en16931's `publish.yml`. The short-lived id-token minted below is
# what authenticates, so there is no NODE_AUTH_TOKEN, no NPM_TOKEN and no
# secrets context here. Provenance is attached automatically by trusted
# publishing; do not add --provenance, which conflicts with it.
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write # OIDC token for npm trusted publishing
  contents: read

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 still ships npm 10.
      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          npm --version

      # A tag that disagrees with package.json publishes the wrong thing under
      # the right name, so fail before anything else runs.
      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME}"
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package.json $pkg" >&2
            exit 1
          fi

      # A version number can be published once. Re-pushing a tag (or pushing
      # one for a release that went out before publishing moved here) must fail
      # loudly, not with npm's generic 403 after the build and tests.
      - name: Check this version is not already on npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@attestwire/en16931@${version}" version >/dev/null 2>&1; then
            echo "@attestwire/en16931@${version} is already published; nothing to do." >&2
            exit 1
          fi

      # The changelog is how a caller learns that a release rejects input the
      # last one accepted. A release whose version has no dated entry is a
      # release nobody can assess.
      - name: Check the changelog documents this version
        run: |
          version="$(node -p "require('./package.json').version")"
          if ! grep -qE "^## \[${version}\] — [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md; then
            echo "CHANGELOG.md has no dated '## [${version}] — YYYY-MM-DD' entry" >&2
            exit 1
          fi

      - run: npm ci

      - run: npm run build

      - run: npm test

      # `files` and `exports` are easy to get wrong in a way no unit test sees:
      # the suite runs against src/, while consumers get the tarball. Install
      # what would actually be published and import it the way a consumer does.
      - name: Smoke-test the packed tarball
        run: |
          tarball="$(npm pack --silent)"
          consumer="$(mktemp -d)"
          mv "$tarball" "$consumer/"
          cd "$consumer"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "./$tarball" >/dev/null
          node -e '
            const { validateInput, parseUblInvoice } = require("@attestwire/en16931");
            if (typeof validateInput !== "function" || typeof parseUblInvoice !== "function") {
              console.error("packed tarball does not export the public API");
              process.exit(1);
            }
            require.resolve("@attestwire/en16931/package.json");
            console.log("packed tarball imports and exports the public API");
          '

      - name: Publish
        run: npm publish
