name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The full suite. vitest 4 and vite need Node 20+, so 18 is covered by
        # the job below rather than here.
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm test

  node18:
    # engines says >=18, so 18 is part of the contract and gets tested — on the
    # built package, which is what a Node 18 user installs. Build with a Node the
    # toolchain supports, then run scripts/smoke-dist.mjs on 18 with no
    # dependencies at all.
    name: node 18 (built package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - run: node --version

      - run: node scripts/smoke-dist.mjs
